name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: MYousafRana/Demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade pip huggingface_hub[cli]

      - name: Login to Hugging Face
        run: huggingface-cli login --token "$HF_TOKEN" --add-to-git-credential

      - name: Configure remote
        run: |
          git config --global credential.helper store
          git remote remove huggingface || true
          git remote add huggingface "https://huggingface.co/${HF_SPACE}.git"

      - name: Push to Hugging Face Space
        run: git push --force huggingface HEAD:main
